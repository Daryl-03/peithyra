services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peithyra}
      POSTGRES_USER: ${POSTGRES_USER:-peithyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peithyra}
    expose:
      - "5432"
    volumes:
      - peithyra-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-peithyra}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-peithyra}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-peithyra}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      - backend

volumes:
  peithyra-postgres-data:
